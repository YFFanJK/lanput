name: Build Windows receiver
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Test and build portable distribution
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Calculate portable checksum
        shell: pwsh
        run: |
          Get-ChildItem dist/*-win-x64.zip | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LANPUT-win-x64
          path: |
            dist/*-win-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
